<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Results - Manta Car Rental</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Ysabeau:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Ysabeau+SC:wght@600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans+SC:wght@400;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Tailwind Config -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            'ysabeau': ['Ysabeau', 'Arial', 'sans-serif'],
            'ysabeau-sc': ['Ysabeau SC', 'Arial', 'sans-serif'],
            'alegreya-sc': ['Alegreya Sans SC', 'Arial', 'sans-serif'],
          },
          colors: {
            'manta-blue': '#4B6697',
            'manta-banner': '#6D7C97',
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Ysabeau', Arial, sans-serif;
    }

    /* Underline animation for nav links */
    .nav-link::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: -5px;
      width: 0;
      height: 2px;
      background-color: black;
      transition: width 0.3s ease;
    }

    .nav-link:hover::after {
      width: 100%;
    }

    /* Custom select arrow */
    select {
      appearance: none;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="12" height="8" viewBox="0 0 12 8"><polyline points="1,1 6,6 11,1" fill="none" stroke="gray" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>');
      background-repeat: no-repeat;
      background-position: right 12px center;
      background-size: 12px 8px;
    }
  </style>
</head>
<body class="m-0 p-0 bg-gray-50">
  <!-- Banner -->
  <header class="bg-manta-banner h-20 lg:h-24 w-full px-4 md:px-8 flex items-center justify-between relative">
    <!-- Logo -->
    <a href="homepage.html" class="flex items-center gap-2 md:gap-3">
      <img src="images/manta.png" alt="Manta Logo" class="h-10 md:h-14 lg:h-16 w-auto">
      <img src="images/mantaname.png" alt="Manta" class="h-7 md:h-9 lg:h-10 w-auto">
    </a>

    <!-- Mobile Menu Button -->
    <button id="mobile-menu-btn" class="lg:hidden text-black p-2">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
      </svg>
    </button>

    <!-- Desktop Navigation -->
    <nav class="hidden lg:flex items-center gap-8 xl:gap-12">
      <!-- Text Links -->
      <div class="flex items-center gap-8 xl:gap-10">
        <a href="vehicles.html" class="nav-link relative font-ysabeau-sc font-semibold text-black text-base xl:text-lg transition-colors">Vehicles</a>
        <a href="location.html" class="nav-link relative font-ysabeau-sc font-semibold text-black text-base xl:text-lg transition-colors">Locations</a>
        <a href="support.html" class="nav-link relative font-ysabeau-sc font-semibold text-black text-base xl:text-lg transition-colors">Support</a>
      </div>

      <!-- Buttons -->
      <div class="flex items-center gap-3">
        <a href="signin.html" class="font-ysabeau-sc font-semibold bg-white text-black px-4 py-2 rounded-lg text-sm hover:bg-manta-blue hover:text-white transition-all">Sign In</a>
        <a href="register.html" class="font-ysabeau-sc font-semibold bg-black text-white px-4 py-2 rounded-lg text-sm hover:bg-manta-blue transition-all">Register</a>
      </div>
    </nav>

    <!-- Mobile Menu -->
    <div id="mobile-menu" class="hidden lg:hidden absolute top-full left-0 right-0 bg-manta-banner shadow-lg z-50">
      <nav class="flex flex-col p-4 gap-4">
        <a href="vehicles.html" class="font-ysabeau-sc font-semibold text-black text-base py-2">Vehicles</a>
        <a href="location.html" class="font-ysabeau-sc font-semibold text-black text-base py-2">Locations</a>
        <a href="support.html" class="font-ysabeau-sc font-semibold text-black text-base py-2">Support</a>
        <div class="flex flex-col gap-2 mt-2">
          <a href="signin.html" class="font-ysabeau-sc font-semibold bg-white text-black px-4 py-2 rounded-lg text-sm text-center">Sign In</a>
          <a href="register.html" class="font-ysabeau-sc font-semibold bg-black text-white px-4 py-2 rounded-lg text-sm text-center">Register</a>
        </div>
      </nav>
    </div>
  </header>

  <!-- Progress Steps -->
  <section class="bg-white border-b border-gray-200">
    <div class="max-w-7xl mx-auto px-4 md:px-8 py-6">
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
        <!-- Rental Details -->
        <div class="flex items-start gap-2 md:gap-4">
          <div class="flex flex-col flex-1">
            <h3 class="font-ysabeau-sc font-semibold text-sm md:text-base mb-1">Rental Details</h3>
            <p id="pickup-date-display" class="text-xs md:text-sm text-gray-600">Loading...</p>
            <p id="dropoff-date-display" class="text-xs md:text-sm text-gray-600">Loading...</p>
          </div>
          <svg class="hidden md:block w-5 h-5 text-gray-400 flex-shrink-0 mt-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
          </svg>
        </div>

        <!-- Pick Up and Return -->
        <div class="flex items-start gap-2 md:gap-4">
          <div class="flex flex-col flex-1">
            <h3 class="font-ysabeau-sc font-semibold text-sm md:text-base mb-1">Pick Up and Return</h3>
            <p id="location-display" class="text-xs md:text-sm text-gray-600">Loading...</p>
          </div>
          <svg class="hidden md:block w-5 h-5 text-gray-400 flex-shrink-0 mt-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
          </svg>
        </div>

        <!-- Vehicle -->
        <div class="flex items-start gap-2 md:gap-4">
          <div class="flex flex-col flex-1">
            <h3 class="font-ysabeau-sc font-semibold text-sm md:text-base mb-1">Vehicle</h3>
            <p class="text-xs md:text-sm text-gray-600">Select</p>
          </div>
          <svg class="hidden md:block w-5 h-5 text-gray-400 flex-shrink-0 mt-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
          </svg>
        </div>

        <!-- Review and Reserve -->
        <div class="flex items-start gap-2 md:gap-4">
          <div class="flex flex-col flex-1">
            <h3 class="font-ysabeau-sc font-semibold text-sm md:text-base mb-1">Review and Reserve</h3>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-4 md:px-8 py-8">
    <!-- Page Title -->
    <h1 class="font-alegreya-sc text-3xl md:text-4xl lg:text-5xl font-normal mb-8">Choose a Vehicle Class</h1>

    <div class="flex flex-col lg:flex-row gap-8">
      <!-- Sidebar Filters -->
      <aside class="lg:w-64 flex-shrink-0">
        <div class="bg-white rounded-lg p-6 shadow-sm sticky top-4">
          <h2 class="font-ysabeau-sc font-semibold text-lg mb-6 pb-2 border-b-2 border-black">Filter By</h2>
          
          <!-- Brand Filter -->
          <div class="mb-6">
            <label for="brand-filter" class="block font-ysabeau font-semibold mb-2 text-sm">Brand</label>
            <select id="brand-filter" class="w-full p-3 pr-10 border border-gray-300 rounded-md bg-white text-sm focus:outline-none focus:border-manta-blue">
              <option value="">All Brands</option>
              <option value="bmw">BMW</option>
              <option value="infiniti">Infiniti</option>
              <option value="mercedes">Mercedes</option>
              <option value="tesla">Tesla</option>
              <option value="audi">Audi</option>
              <option value="lexus">Lexus</option>
              <option value="toyota">Toyota</option>
              <option value="honda">Honda</option>
              <option value="kia">Kia</option>
              <option value="hyundai">Hyundai</option>
            </select>
          </div>

          <!-- Model Filter -->
          <div class="mb-6">
            <label for="model-filter" class="block font-ysabeau font-semibold mb-2 text-sm">Model</label>
            <select id="model-filter" class="w-full p-3 pr-10 border border-gray-300 rounded-md bg-white text-sm focus:outline-none focus:border-manta-blue">
              <option value="">All Models</option>
              <!-- Models will be populated dynamically -->
            </select>
          </div>

          <!-- Year Filter -->
          <div class="mb-6">
            <label for="year-filter" class="block font-ysabeau font-semibold mb-2 text-sm">Year</label>
            <select id="year-filter" class="w-full p-3 pr-10 border border-gray-300 rounded-md bg-white text-sm focus:outline-none focus:border-manta-blue">
              <option value="">All Years</option>
              <option value="2024">2024</option>
              <option value="2023">2023</option>
              <option value="2022">2022</option>
              <option value="2021">2021</option>
              <option value="2020">2020</option>
            </select>
          </div>
        </div>
      </aside>

      <!-- Vehicle Grid -->
      <div class="flex-1">
        <div id="vehicle-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
          <!-- Vehicles will be populated by JavaScript -->
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-manta-banner mt-12 md:mt-16">
    <div class="max-w-7xl mx-auto px-2 md:px-6 py-8 md:py-10">
      <div class="flex flex-col md:flex-row items-start justify-between gap-8 md:gap-4">
        <!-- Logo - positioned more to the left -->
        <div class="flex-shrink-0 md:mr-4">
          <img src="images/footerlogo.png" alt="Manta Logo" class="w-56 md:w-64 lg:w-72 h-auto">
        </div>

        <!-- Links - aligned at top of images -->
        <div class="flex flex-col sm:flex-row items-start gap-8 md:gap-12 lg:gap-16 flex-1 justify-center md:justify-end">
          <div class="flex items-start">
            <img src="images/customersupport.png" alt="Customer Support" class="w-48 md:w-52 lg:w-56 h-auto">
          </div>
          <div class="flex items-start">
            <img src="images/aboutus.png" alt="About Us" class="w-40 md:w-44 lg:w-48 h-auto">
          </div>
          <div class="flex items-start">
            <img src="images/carsales.png" alt="Car Sales" class="w-44 md:w-48 lg:w-52 h-auto">
          </div>
        </div>
      </div>
    </div>
  </footer>

  <!-- Copyright Section -->
  <section class="bg-white py-2 px-4 md:px-8">
    <p class="font-ysabeau-sc text-xs md:text-sm text-left">©2025 Manta Inc.</p>
  </section>

  <script src="car_select.js"></script>
</body>
</html>
